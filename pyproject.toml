[project]
name = "dabubble-backend"
version = "0.1.0"
description = "Django backend (REST API + WebSockets) for DABubble."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "django-tasks-db>=0.13.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary,pool]>=3.3.9",
    "sentry-sdk>=3.0.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "C4", "DTZ", "T20", "PT", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and test passwords
"config/settings/*" = ["F403", "F405"]
".claude/hooks/*" = ["S603", "S607"]  # runs the local ruff on a file path

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", ".venv/"]

[[tool.mypy.overrides]]
# These packages ship no type hints.
module = ["channels.*", "daphne.*", "environ.*", "storages.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy's declaration classes (Sequence, Faker, ...) have untyped constructors.
module = ["apps.*.tests.factories"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-markers --reuse-db"
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]
